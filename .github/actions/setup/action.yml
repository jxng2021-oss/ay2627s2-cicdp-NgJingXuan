name: Set up Node.js and pnpm
description: Installs pnpm and the Node.js version from .nvmrc, then (optionally) installs dependencies from the lockfile.

inputs:
  install-dependencies:
    description: Run `pnpm install`. The security scans only need pnpm and Node.js.
    default: "true"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: ${{ inputs.install-dependencies == 'true' && 'pnpm' || '' }}

    - if: inputs.install-dependencies == 'true'
      run: pnpm install --frozen-lockfile
      shell: bash
