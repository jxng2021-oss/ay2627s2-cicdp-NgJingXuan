name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: rustup show
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      - run: pnpm lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_PASSWORD: ci-only-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:ci-only-test-password@localhost:5432/postgres
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: rustup show
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      - run: pnpm test
      - run: pnpm test:database

  compatibility:
    name: compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_PASSWORD: ci-only-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:ci-only-test-password@localhost:5432/postgres
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: rustup show
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      - run: pnpm test:compat

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: rustup show
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      - run: pnpm build

  migrations:
    name: migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm db:check

  api-spec:
    name: api-spec
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm api:check

  api-breaking-changes:
    name: api-breaking-changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm api:breaking
        env:
          API_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: docker-compose.yml
          set: |
            gateway.cache-from=type=gha,scope=gateway
            gateway.cache-to=type=gha,scope=gateway,mode=max
            storage.cache-from=type=gha,scope=storage
            storage.cache-to=type=gha,scope=storage,mode=max
            secrets.cache-from=type=gha,scope=secrets
            secrets.cache-to=type=gha,scope=secrets,mode=max
            audit.cache-from=type=gha,scope=audit
            audit.cache-to=type=gha,scope=audit,mode=max
            identity.cache-from=type=gha,scope=identity
            identity.cache-to=type=gha,scope=identity,mode=max
            flags.cache-from=type=gha,scope=flags
            flags.cache-to=type=gha,scope=flags,mode=max
            mock-upstream.cache-from=type=gha,scope=mock-upstream
            mock-upstream.cache-to=type=gha,scope=mock-upstream,mode=max
            dashboard.cache-from=type=gha,scope=dashboard
            dashboard.cache-to=type=gha,scope=dashboard,mode=max
            demo-shop.cache-from=type=gha,scope=demo-shop
            demo-shop.cache-to=type=gha,scope=demo-shop,mode=max

  e2e:
    name: e2e
    needs: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: docker-compose.yml
          load: true
          set: |
            gateway.cache-from=type=gha,scope=gateway
            storage.cache-from=type=gha,scope=storage
            secrets.cache-from=type=gha,scope=secrets
            audit.cache-from=type=gha,scope=audit
            identity.cache-from=type=gha,scope=identity
            flags.cache-from=type=gha,scope=flags
            mock-upstream.cache-from=type=gha,scope=mock-upstream
            dashboard.cache-from=type=gha,scope=dashboard
            demo-shop.cache-from=type=gha,scope=demo-shop

      - name: Generate test secrets
        run: |
          for name in POSTGRES_PASSWORD GATEWAY_DB_PASSWORD SECRETS_DB_PASSWORD \
            STORAGE_DB_PASSWORD REDIS_PASSWORD ADMIN_TOKEN API_KEY_HASH_SECRET \
            INTERNAL_SERVICE_TOKEN AUDIT_MIGRATOR_DB_PASSWORD AUDIT_DB_PASSWORD \
            AUDIT_HMAC_KEY AUDIT_TOKEN_GATEWAY AUDIT_TOKEN_SECRETS AUDIT_TOKEN_STORAGE \
            SESSION_SECRET FLAGS_DB_PASSWORD IDENTITY_DB_PASSWORD IDENTITY_SERVICE_TOKEN AUDIT_TOKEN_IDENTITY AUDIT_TOKEN_FLAGS; do
            value="$(openssl rand -hex 32)"
            # nosemgrep: yaml.github-actions.security.audit.unsafe-add-mask-workflow-command.unsafe-add-mask-workflow-command
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - run: pnpm stack:up
      - run: pnpm test:e2e

      - run: pnpm test:ui:install
      - name: Connect the demo shop to the stack (test data only)
        run: pnpm demo:setup
        env:
          LOCAL_DEV_MODE: "true"
      - run: pnpm test:demo

      - run: pnpm test:ui
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/dashboard/playwright-report/
            apps/dashboard/test-results/
            apps/demo-shop/playwright-report/
            apps/demo-shop/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Re-run database setup and migrations on the existing databases
        run: |
          docker compose --env-file tests/e2e/e2e.env run --rm db-setup
          docker compose --env-file tests/e2e/e2e.env run --rm migrate
          docker compose --env-file tests/e2e/e2e.env run --rm secrets-migrate
          docker compose --env-file tests/e2e/e2e.env run --rm storage-migrate
          docker compose --env-file tests/e2e/e2e.env run --rm audit-migrate
          docker compose --env-file tests/e2e/e2e.env run --rm identity-migrate
          docker compose --env-file tests/e2e/e2e.env run --rm flags-migrate

      - run: pnpm test:stack

      - name: Print container logs
        if: failure()
        run: docker compose logs --no-color --timestamps

      - name: Shut the stack down
        if: always()
        run: pnpm stack:down

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install-dependencies: "false"
      - run: pnpm scan:secrets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: secret-scan-report
          path: reports/
          retention-days: 7
          if-no-files-found: ignore

  code-scan:
    name: code-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install-dependencies: "false"
      - run: pnpm scan:code
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: code-scan-report
          path: reports/
          retention-days: 7
          if-no-files-found: ignore

  dependency-scan:
    name: dependency-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install-dependencies: "false"
      - run: pnpm scan:deps
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dependency-scan-report
          path: reports/
          retention-days: 7
          if-no-files-found: ignore

  rust-audit:
    name: rust-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install-dependencies: "false"
      - run: rustup show
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-0.23.0-${{ runner.os }}
      - run: command -v cargo-audit || pnpm scan:rust:install
      - run: pnpm scan:rust

  image-scan:
    name: image-scan
    needs: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install-dependencies: "false"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: docker-compose.yml
          load: true
          set: |
            gateway.cache-from=type=gha,scope=gateway
            storage.cache-from=type=gha,scope=storage
            secrets.cache-from=type=gha,scope=secrets
            audit.cache-from=type=gha,scope=audit
            identity.cache-from=type=gha,scope=identity
            flags.cache-from=type=gha,scope=flags
            mock-upstream.cache-from=type=gha,scope=mock-upstream
            dashboard.cache-from=type=gha,scope=dashboard
            demo-shop.cache-from=type=gha,scope=demo-shop
      - run: pnpm scan:images
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: image-scan-report
          path: reports/
          retention-days: 7
          if-no-files-found: ignore

  ci-success:
    name: ci-success
    if: always()
    needs:
      - lint
      - typecheck
      - unit-tests
      - compatibility
      - build
      - migrations
      - api-spec
      - api-breaking-changes
      - docker-build
      - e2e
      - secret-scan
      - code-scan
      - dependency-scan
      - rust-audit
      - image-scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null

  publish:
    name: publish
    needs: ci-success
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Log in to ECR
        run: aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: docker-compose.yml
          targets: |
            gateway
            storage
            secrets
            audit
            identity
            flags
            dashboard
          push: true
          set: |
            gateway.cache-from=type=gha,scope=gateway
            storage.cache-from=type=gha,scope=storage
            secrets.cache-from=type=gha,scope=secrets
            audit.cache-from=type=gha,scope=audit
            identity.cache-from=type=gha,scope=identity
            flags.cache-from=type=gha,scope=flags
            dashboard.cache-from=type=gha,scope=dashboard
            gateway.tags=${{ vars.ECR_REGISTRY }}/secure-cloud-platform/gateway:${{ github.sha }}
            storage.tags=${{ vars.ECR_REGISTRY }}/secure-cloud-platform/storage:${{ github.sha }}
            secrets.tags=${{ vars.ECR_REGISTRY }}/secure-cloud-platform/secrets:${{ github.sha }}
            audit.tags=${{ vars.ECR_REGISTRY }}/secure-cloud-platform/audit:${{ github.sha }}
            identity.tags=${{ vars.ECR_REGISTRY }}/secure-cloud-platform/identity:${{ github.sha }}
            flags.tags=${{ vars.ECR_REGISTRY }}/secure-cloud-platform/flags:${{ github.sha }}
            dashboard.tags=${{ vars.ECR_REGISTRY }}/secure-cloud-platform/dashboard:${{ github.sha }}

  deploy:
    name: deploy
    needs: publish
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy this commit on the server (Systems Manager)
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          DEPLOY_DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/home/ubuntu/secure-cloud' }}
          IMAGE_REPOSITORY: ${{ vars.ECR_REGISTRY }}/secure-cloud-platform
          AWS_REGION: ${{ vars.AWS_REGION }}
          PROXY_ALLOWED_HOSTS: ${{ vars.PROXY_ALLOWED_HOSTS }}
        run: |
          if [[ -n "$PROXY_ALLOWED_HOSTS" && ! "$PROXY_ALLOWED_HOSTS" =~ ^[a-z0-9.-]+(,[a-z0-9.-]+)*$ ]]; then
            echo "::error::PROXY_ALLOWED_HOSTS must be host names separated by commas"
            exit 1
          fi
          parameters="$(jq -n \
            --arg dir "$DEPLOY_PATH" --arg sha "$GITHUB_SHA" --arg repo "$IMAGE_REPOSITORY" \
            --arg region "$AWS_REGION" --arg domain "$DEPLOY_DOMAIN" \
            --arg hosts "$PROXY_ALLOWED_HOSTS" '{
              commands: [
                "set -eu",
                "export PATH=\"$PATH:/snap/bin\"",
                "sudo -u ubuntu git -C \($dir) fetch --quiet origin",
                "sudo -u ubuntu git -C \($dir) checkout --quiet --detach \($sha)",
                "PROXY_ALLOWED_HOSTS=\($hosts) AWS_REGION=\($region) IMAGE_REPOSITORY=\($repo) IMAGE_TAG=\($sha) bash \($dir)/deploy/deploy.sh \($domain)"
              ],
              executionTimeout: ["1500"]
            }')"
          command_id="$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript --comment "deploy $GITHUB_SHA" \
            --parameters "$parameters" --query Command.CommandId --output text)"
          echo "Systems Manager command $command_id"
          status=Pending
          for _ in $(seq 1 150); do
            sleep 10
            status="$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)"
            case "$status" in Success | Failed | Cancelled | TimedOut) break ;; esac
          done
          output="$(aws ssm get-command-invocation --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" --query '[StandardOutputContent, StandardErrorContent]' --output text)"
          echo "$output"
          if grep -q "NEXT: unseal" <<<"$output"; then
            echo "::warning::Deployed, but the secrets service restarted sealed: 3 operators must unseal it."
          elif grep -q "NEXT: initialise" <<<"$output"; then
            echo "::warning::Deployed, but the secrets service is not initialised yet."
          fi
          echo "Deploy finished with status $status"
          [[ "$status" == "Success" ]]
