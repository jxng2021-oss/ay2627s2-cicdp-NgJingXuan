[package]
name = "secrets"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[test]]
name = "crypto"
path = "../../tests/secrets-rs/crypto.rs"

[[test]]
name = "compatibility"
path = "../../tests/secrets-rs/compatibility.rs"

[[test]]
name = "secrets"
path = "../../tests/secrets-rs/secrets.rs"

[[test]]
name = "shamir"
path = "../../tests/secrets-rs/shamir.rs"

[[test]]
name = "operator"
path = "../../tests/secrets-rs/operator.rs"

[[test]]
name = "seal"
path = "../../tests/secrets-rs/seal.rs"

[dependencies]
aes-gcm = { version = "=0.10.3", features = ["zeroize"] }
axum = "=0.8.4"
base64 = "=0.22.1"
chrono = { version = "=0.4.41", default-features = false, features = ["clock", "std"] }
rand = "=0.8.6"
rpassword = "=7.5.5"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate", "macros"] }
tokio = { version = "=1.51.6", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "signal", "time", "sync"] }
tracing = "=0.1.41"
uuid = { version = "=1.17.0", features = ["v4", "serde"] }
zeroize = "=1.8.1"

[dev-dependencies]
hex = "=0.4.3"
http-body-util = "=0.1.3"
tower = { version = "=0.5.2", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
