[package]
name = "storage"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "storage"
path = "src/main.rs"

[[test]]
name = "chunks"
path = "../../tests/storage/chunks.rs"

[[test]]
name = "compatibility"
path = "../../tests/storage/compatibility.rs"

[[test]]
name = "config"
path = "../../tests/storage/config.rs"

[[test]]
name = "files"
path = "../../tests/storage/files.rs"

[[test]]
name = "contract"
path = "../../tests/storage/contract.rs"

[dependencies]
aes-gcm = { version = "=0.10.3", features = ["zeroize"] }
axum = "=0.8.4"
base64 = "=0.22.1"
bytes = "=1.11.1"
chrono = { version = "=0.4.41", default-features = false, features = ["clock", "std"] }
futures-util = "=0.3.31"
percent-encoding = "=2.3.1"
rand = "=0.8.6"
reqwest = { version = "=0.12.22", default-features = false, features = ["json"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
sha2 = "=0.10.9"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate", "macros"] }
tokio = { version = "=1.51.6", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "signal", "time", "sync"] }
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.20", features = ["json", "env-filter"] }
uuid = { version = "=1.17.0", features = ["v4", "serde"] }
zeroize = "=1.8.1"

[dev-dependencies]
hex = "=0.4.3"
http-body-util = "=0.1.3"
jsonschema = { version = "=0.30.0", default-features = false }
tower = { version = "=0.5.2", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
